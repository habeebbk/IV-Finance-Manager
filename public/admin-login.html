<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Login - Class Trip Ledger</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- FontAwesome CDN -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Sora:wght@600;700;800&display=swap" rel="stylesheet">

  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['"Plus Jakarta Sans"', 'sans-serif'],
            display: ['"Sora"', 'sans-serif']
          },
          colors: {
            college: {
              50: '#eef2ff',
              100: '#e0e7ff',
              600: '#4f46e5',
              700: '#4338ca',
              800: '#3730a3'
            }
          }
        }
      }
    }
  </script>
</head>
<body class="bg-slate-900 font-sans min-h-screen flex flex-col items-center justify-center p-4 selection:bg-college-600 selection:text-white">

  <!-- Background decorative glows -->
  <div class="fixed inset-0 overflow-hidden pointer-events-none -z-10">
    <div class="absolute -top-40 -left-40 w-96 h-96 bg-indigo-600/20 rounded-full blur-3xl"></div>
    <div class="absolute -bottom-40 -right-40 w-96 h-96 bg-purple-600/20 rounded-full blur-3xl"></div>
  </div>

  <div class="w-full max-w-md bg-slate-800/90 backdrop-blur-xl rounded-3xl shadow-2xl border border-slate-700/80 overflow-hidden">
    <!-- Header -->
    <div class="bg-gradient-to-r from-slate-900 via-indigo-950 to-slate-900 p-7 text-white text-center border-b border-slate-700/60">
      <div class="w-16 h-16 bg-indigo-500/10 border border-indigo-400/30 rounded-2xl mx-auto flex items-center justify-center text-2xl text-indigo-400 shadow-inner mb-3">
        <i class="fa-solid fa-shield-halved"></i>
      </div>
      <div class="inline-flex items-center gap-1.5 px-3 py-1 rounded-full bg-indigo-500/10 border border-indigo-400/20 text-indigo-300 text-[11px] font-bold tracking-wide uppercase mb-2">
        <i class="fa-solid fa-lock text-[10px]"></i> Authorized Access Only
      </div>
      <h1 class="text-xl font-extrabold font-display text-white">Admin Control Panel</h1>
      <p class="text-xs text-slate-400 mt-1">Class Trip Ledger Management Portal</p>
    </div>

    <!-- Body -->
    <div class="p-6">
      <!-- Alert Box -->
      <div id="errorAlert" class="hidden mb-4 p-3 bg-rose-500/10 border border-rose-500/30 text-rose-300 rounded-xl text-xs flex items-center gap-2">
        <i class="fa-solid fa-circle-exclamation shrink-0 text-sm"></i>
        <span id="errorMessage">Invalid credentials</span>
      </div>

      <!-- Admin Login Form -->
      <form id="adminLoginForm" class="space-y-4">
        <div>
          <label class="block text-xs font-bold text-slate-300 mb-1">Admin Username</label>
          <div class="relative">
            <span class="absolute left-3.5 top-3 text-slate-500 text-xs">
              <i class="fa-solid fa-user-shield"></i>
            </span>
            <input type="text" id="adminUsername" required autofocus placeholder="Enter admin username" class="w-full pl-9 pr-3.5 py-2.5 bg-slate-900/80 border border-slate-700 rounded-xl text-xs font-semibold text-white placeholder-slate-500 focus:bg-slate-900 focus:outline-none focus:border-indigo-500 focus:ring-1 focus:ring-indigo-500 transition">
          </div>
        </div>

        <div>
          <label class="block text-xs font-bold text-slate-300 mb-1">Admin Password</label>
          <div class="relative">
            <span class="absolute left-3.5 top-3 text-slate-500 text-xs">
              <i class="fa-solid fa-key"></i>
            </span>
            <input type="password" id="adminPassword" required placeholder="Enter admin password" class="w-full pl-9 pr-10 py-2.5 bg-slate-900/80 border border-slate-700 rounded-xl text-xs font-semibold text-white placeholder-slate-500 focus:bg-slate-900 focus:outline-none focus:border-indigo-500 focus:ring-1 focus:ring-indigo-500 transition">
            <button type="button" id="toggleAdminPassBtn" class="absolute right-3.5 top-3 text-slate-500 hover:text-slate-300 text-xs cursor-pointer">
              <i class="fa-regular fa-eye"></i>
            </button>
          </div>
        </div>

        <button type="submit" id="adminSubmitBtn" class="w-full py-3 bg-gradient-to-r from-indigo-600 to-indigo-500 hover:from-indigo-500 hover:to-indigo-600 text-white font-bold text-xs rounded-xl shadow-lg shadow-indigo-600/30 transition flex items-center justify-center gap-2 cursor-pointer mt-2">
          <span>Sign In to Admin Panel</span>
          <i class="fa-solid fa-arrow-right text-[11px]"></i>
        </button>
      </form>
    </div>

    <!-- Footer info -->
    <div class="p-4 bg-slate-900/50 border-t border-slate-700/60 text-center text-[11px] text-slate-400 font-medium flex items-center justify-between">
      <a href="/login.html" class="text-slate-400 hover:text-indigo-300 transition flex items-center gap-1.5">
        <i class="fa-solid fa-arrow-left text-[10px]"></i> Student Portal
      </a>
      <span class="text-slate-500">
        <i class="fa-solid fa-lock text-[10px] mr-1"></i> Secured Session
      </span>
    </div>
  </div>

  <script>
    function togglePassVisibility(inputId) {
      const el = document.getElementById(inputId);
      el.type = el.type === 'password' ? 'text' : 'password';
    }

    function showError(msg) {
      const alert = document.getElementById('errorAlert');
      document.getElementById('errorMessage').innerText = msg;
      alert.classList.remove('hidden');
    }

    function hideError() {
      document.getElementById('errorAlert').classList.add('hidden');
    }

    async function handleAdminLogin(e) {
      if (e) e.preventDefault();
      hideError();
      const btn = document.getElementById('adminSubmitBtn');
      const originalText = btn.innerHTML;
      btn.innerHTML = `<i class="fa-solid fa-circle-notch fa-spin text-sm"></i> <span>Verifying...</span>`;
      btn.disabled = true;

      const payload = {
        role: 'admin',
        username: document.getElementById('adminUsername').value.trim(),
        password: document.getElementById('adminPassword').value
      };

      try {
        const res = await fetch('/api/auth/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload)
        });

        const data = await res.json();
        if (!res.ok) {
          showError(data.error || 'Authentication failed. Please verify credentials.');
          btn.innerHTML = originalText;
          btn.disabled = false;
          return;
        }

        // Redirect directly to admin panel
        window.location.href = data.redirectTo || '/index.html';
      } catch (err) {
        showError('Network error connecting to server. Please check your connection.');
        btn.innerHTML = originalText;
        btn.disabled = false;
      }
    }

    document.addEventListener('DOMContentLoaded', () => {
      document.getElementById('toggleAdminPassBtn').addEventListener('click', () => togglePassVisibility('adminPassword'));
      document.getElementById('adminLoginForm').addEventListener('submit', handleAdminLogin);
    });
  </script>
</body>
</html>
